[project]
name = "dynamisetl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "dagster>=1.13.23",
    "dagster-webserver>=1.13.23",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "orjson>=3.12.0",
    "pint>=0.26.1",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
dynamis-registry-validate = "dynamis.registry:main"
dynamis-synthetic-materialize = "dynamis.fixtures.cli:main"

[build-system]
requires = ["uv-build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dynamis"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL instance (DYNAMIS_TEST_POSTGRES_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "infra/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions embed long single-line DDL string literals for
# CHECK constraints; they cannot be wrapped without hand-editing generated code.
"infra/migrations/versions/*.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests", "infra/migrations"]
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
# Workflow security auditing used by the "Workflow lint" CI gate. Kept in its
# own group (not `dev`) so the test environment stays focused; the exact version
# is pinned because it runs unattended on every pull request.
lint = ["zizmor==1.30.1"]
