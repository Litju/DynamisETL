# Laboratory shell; /api is proxied to the analytical API service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apache.arrow.stream;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths render the workbench shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
